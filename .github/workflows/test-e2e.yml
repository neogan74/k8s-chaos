name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-e2e:
    name: E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: manager, focus: "e2e suite Manager" }
          - { name: disk-fill, focus: "e2e suite Disk Fill" }
          - { name: memory-stress, focus: "e2e suite Memory Stress" }
          - { name: network-loss, focus: "e2e suite Pod Network Loss" }
          - { name: network-partition, focus: "e2e suite Network Partition" }
          - { name: pod-restart, focus: "e2e suite Pod Restart" }
    env:
      # Each shard runs on its own runner with its own Kind cluster.
      KIND_CLUSTER: k8s-chaos-e2e-${{ matrix.suite.name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e E2E_FOCUS="${{ matrix.suite.focus }}"
