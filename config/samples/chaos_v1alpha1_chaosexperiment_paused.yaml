apiVersion: chaos.gushchin.dev/v1alpha1
kind: ChaosExperiment
metadata:
  labels:
    app.kubernetes.io/name: k8s-chaos
    app.kubernetes.io/managed-by: kustomize
  name: chaosexperiment-paused
  namespace: chaos-testing
spec:
  action: "pod-kill"
  namespace: "default"
  selector:
    app: nginx
  count: 1

  # Paused stops the controller from running the action; status.phase becomes "Paused".
  # Resume with: kubectl patch chaosexperiment chaosexperiment-paused --type merge -p '{"spec":{"paused":false}}'
  # Pausing does not roll back chaos that was already applied, and experimentDuration
  # keeps counting from status.startTime while paused.
  paused: true
